<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../static/bg/favicon/ico/apple-icon-180x180.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../static/bg/favicon/ico/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../static/bg/favicon/ico/favicon-16x16.png"
    />
    <link rel="manifest" href="../static/bg/favicon/ico/manifest.json" />
    <meta name="theme-color" content="#111217" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <title>Quản Lý Phim - Admin Dashboard</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Montserrat", sans-serif;
      }

      body {
        background-color: #111217;
        color: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 20px;
        position: relative;
      }

      .pic-bg-sign-up {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.15;
      }
      .pic-bg-sign-up img {
        width: 100%;
        height: 100%;
      }

      .admin-container {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 30px;
        width: 100%;
        max-width: 1100px;
        z-index: 1;
      }

      form {
        background: rgba(26, 29, 38, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 36px;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .form-header {
        margin-bottom: 25px;
        text-align: center;
      }
      .form-header h2 {
        font-size: 24px;
        color: #ffffff;
        margin-bottom: 8px;
      }
      .form-header p {
        font-size: 13px;
        color: #9ca3af;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-bottom: 25px;
      }

      .full-width {
        grid-column: span 2;
      }

      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .group label {
        font-size: 12px;
        font-weight: 600;
        color: #d1d5db;
        text-transform: uppercase;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-wrapper i {
        position: absolute;
        left: 14px;
        color: #6b7280;
        font-size: 16px;
        transition: color 0.3s ease;
      }

      .input-wrapper input {
        width: 100%;
        padding: 14px 14px 14px 42px;
        background-color: #0d0e12;
        border: 1px solid #2d313f;
        border-radius: 8px;
        color: #ffffff;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      button[type="submit"] {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 8px;
        color: #ffffff;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      .btn-add {
        background: linear-gradient(135deg, #ff334b 0%, #cc001f 100%);
      }
      .btn-add:hover {
        background: linear-gradient(135deg, #ff4d61 0%, #dd0026 100%);
      }

      .btn-delete {
        background: linear-gradient(135deg, #4b5563 0%, #1f2937 100%);
      }
      .btn-delete:hover {
        background: linear-gradient(135deg, #6b7280, #374151);
      }

      .delete-section {
        justify-content: flex-start;
        gap: 20px;
      }
    </style>
  </head>
  <body>
    <div class="pic-bg-sign-up">
      <img src="../static/bg/img/dki.bg.webp" alt="Ảnh BG Sign Up" />
    </div>

    <div class="admin-container">
      <form action="/admin/add-film" method="post">
        <div class="form-header">
          <h2>THÊM PHIM MỚI</h2>
          <p>Điền đầy đủ thông tin để thêm phim vào hệ thống</p>
        </div>

        <div class="form-grid">
          <div class="group full-width">
            <label for="title">Tiêu đề phim</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="title"
                name="title"
                placeholder="Ví dụ: Avatar: Dòng Chảy Của Nước"
                required
              />
              <i class="fa-solid fa-film"></i>
            </div>
          </div>

          <div class="group">
            <label for="duration">Thời lượng phim</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="duration"
                name="duration"
                placeholder="Ví dụ: 192 phút"
                required
              />
              <i class="fa-solid fa-clock"></i>
            </div>
          </div>

          <div class="group">
            <label for="origin">Xuất xứ phim</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="origin"
                name="origin"
                placeholder="Ví dụ: Mỹ, Hàn Quốc..."
                required
              />
              <i class="fa-solid fa-earth-asia"></i>
            </div>
          </div>

          <div class="group">
            <label for="date">Ngày công chiếu</label>
            <div class="input-wrapper">
              <input type="text" id="date" name="date" required />
              <i class="fa-solid fa-calendar-days"></i>
            </div>
          </div>

          <div class="group">
            <label for="age">Độ tuổi xem phim</label>
            <div class="input-wrapper">
              <input
                type="number"
                id="age"
                name="age"
                min="0"
                placeholder="Ví dụ: 18"
                required
              />
              <i class="fa-solid fa-user-shield"></i>
            </div>
          </div>

          <div class="group full-width">
            <label for="genre">Thể loại phim</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="genre"
                name="genre"
                placeholder="Ví dụ: Hành động, Viễn tưởng"
                required
              />
              <i class="fa-solid fa-tags"></i>
            </div>
          </div>

          <div class="group full-width">
            <label for="img_url">Đường dẫn ảnh bìa (URL_IMG)</label>
            <div class="input-wrapper">
              <input
                type="url"
                id="img_url"
                name="img_url"
                placeholder="https://example.com/poster.jpg"
                required
              />
              <i class="fa-solid fa-image"></i>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-add">
          <i class="fa-solid fa-plus"></i> Thêm phim vào hệ thống
        </button>
      </form>

      <form action="/admin/delete-film" method="post" class="delete-section">
        <div class="form-header">
          <h2>XÓA PHIM</h2>
          <p>Nhập chính xác ID phim cần gỡ bỏ</p>
        </div>

        <div class="group">
          <label for="id_film">ID Phim cần xóa</label>
          <div class="input-wrapper">
            <input
              type="number"
              id="id_film"
              name="id_film"
              placeholder="Ví dụ: 12"
              required
            />
            <i class="fa-solid fa-key"></i>
          </div>
        </div>

        <button type="submit" class="btn-delete">
          <i class="fa-solid fa-trash-can"></i> Xóa phim khỏi hệ thống
        </button>
      </form>
    </div>
    <div class="surround_film">
      {%for movie in movies%}
      <div
        class="inf_film"
        onclick="window.location.href='{{ url_for('menu.film_shln') }}' "
      >
        <div class="left">
          <a href="{{ url_for('menu.film_shln') }}"
            ><img src="{{ url_for('static', filename=movie.img_url) }}" alt=""
          /></a>
        </div>
        <div class="right">
          <div class="blur">
            <p>{{movie.genre}}</p>
          </div>
          <h3>{{movie.title}}</h3>

          <p>{{movie.id_movie}}</p>

          <h4>Lịch chiếu</h4>
          <div class="btn_showtime">
            <button>{{movie.showtime}}</button>
          </div>
        </div>
      </div>
      {%endfor%}
    </div>
  </body>
</html>
